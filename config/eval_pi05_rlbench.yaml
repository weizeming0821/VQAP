checkpoint:
  # best | latest | official
  which: best
  # ===== 默认评测 delta 实验(pi05_rlbench_delta_train)。=====
  # 如需评旧的绝对位姿实验,四处一起改回:
  #   train_config_name: pi05_rlbench_pt
  #   finetuned_root_dir: checkpoints/pi05_rlbench_train
  #   rlbench_norm_stats_dir: openpi-vqap/assets/pi05_rlbench/train
  #   action_space: absolute
  train_config_name: pi05_rlbench_delta_pt
  finetuned_root_dir: checkpoints/pi05_rlbench_delta_train
  official_dir: openpi_cache/openpi-assets/checkpoints/pi05_base_pytorch
  rlbench_norm_stats_dir: openpi-vqap/assets/pi05_rlbench_delta/train_delta
  # absolute: 模型输出绝对位姿; delta: 模型输出 [dxyz, rot6d(dR), grip],评测端与当前位姿合成。
  action_space: delta

dataset:
  raw_root: RLBench_Raw_Dataset
  split: val
  variation_mode: demo_replay
  start_episode: 0
  episodes_per_task: 25

environment:
  headless: true
  image_size: 224
  max_steps: 400          # demo 最长约 352 步（stack_blocks），250 会让长任务必然超时
  replan_steps: 10
  gripper_threshold: 0.5
  # planning: 每步路径规划、在每个 waypoint 完全停稳（卡顿，replay 上限 91.7%）；
  # ik: 逐帧 IK 伺服，平滑但接触/滞后时会发散（replay 上限 75%）；
  # hybrid: IK 优先，IK 失败单步回退 planning（推荐）。
  arm_action_mode: hybrid

runtime:
  device: auto
  seed: 42

logging:
  log_root: log
  log_name_prefix: pi05_rlbench_eval

recording:
  enabled: true
  videos_per_task: 1      # 成功、失败各录 N 条（N=1 -> 每任务最多 1 成功 + 1 失败）
  save_dir: result
  resolution: [640, 480]  # [width, height]，独立于评测观测相机
  fps: 30
  rotate_speed: 0.005     # 相机每仿真步旋转弧度；0 = 固定机位

tasks:
  names:
    - close_jar
    - insert_onto_square_peg
    - light_bulb_in
    - meat_off_grill
    - open_drawer
    - place_cups
    - place_shape_in_shape_sorter
    - push_buttons
    - put_groceries_in_cupboard
    - put_item_in_drawer
    - put_money_in_safe
    - reach_and_drag
    - slide_block_to_target
    - stack_blocks
    - stack_cups
    - stack_wine
    - sweep_to_dustpan
    - turn_tap
